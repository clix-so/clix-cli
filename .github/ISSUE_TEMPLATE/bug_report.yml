name: Bug Report
description: Report a bug or unexpected behavior in Clix CLI
title: "[BUG] "
labels:
  - bug
  - status/needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!

        Before submitting, please check:
        - You're using the [latest version](https://www.npmjs.com/package/@clix-so/clix-cli) of Clix CLI (`clix --version`)
        - This issue hasn't already been reported by searching [existing issues](https://github.com/clix-so/clix-cli/issues?q=is%3Aissue+label%3Abug)

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      description: Please confirm before submitting
      options:
        - label: I have searched [existing issues](https://github.com/clix-so/clix-cli/issues?q=is%3Aissue+label%3Abug) and this hasn't been reported yet
          required: true
        - label: I am using the latest version of Clix CLI
          required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe what's happening that shouldn't be
      placeholder: |
        When I run `clix integrate`, the CLI shows an error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the expected behavior
      placeholder: The CLI should successfully guide me through SDK integration...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide clear, numbered steps that anyone can follow to reproduce the issue.
        Include any necessary context or configuration.
      placeholder: |
        1. Run `clix` to start interactive mode
        2. Type `/integrate`
        3. Select iOS platform
        4. Error appears: "..."
    validations:
      required: true

  - type: textarea
    id: cli_info
    attributes:
      label: CLI Information
      description: Please provide your CLI version and environment details
      value: |
        **Clix CLI Version:** <!-- Run `clix --version` -->
        **Platform:** <!-- macOS / Linux -->
        **Terminal:** <!-- Terminal.app / iTerm2 / VS Code / Warp / Other -->
        **Bun Version (if running from source):** <!-- Run `bun --version` -->
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: Related Skill/Command
      description: Which skill or command was involved?
      options:
        - Interactive Chat (default)
        - /integrate (SDK Integration)
        - /track (Event Tracking)
        - /user (User Management)
        - /personalize (Personalization)
        - /diagnose (SDK Diagnosis)
        - /debug (Debugging Assistant)
        - install-mcp
        - config
        - Other
    validations:
      required: false

  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      description: Did this work in a previous version?
      options:
        - "Yes, this worked in a previous version"
        - "No, this never worked"
        - "I don't know"
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error Messages/Logs
      description: |
        Paste any error output or logs here.
        Tip: Use `DEBUG=1 clix <command>` for verbose output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: |
        Anything else that might help us understand the issue?
        - Screenshots
        - Configuration files
        - Related project structure
      placeholder: Any additional context, screenshots, or information...
    validations:
      required: false
